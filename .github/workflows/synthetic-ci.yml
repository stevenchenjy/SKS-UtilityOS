name: Synthetic source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, MIT
        with:
          python-version: '3.13.15'
      - name: Fetch exact reviewed platform artifacts
        run: python scripts/dependency_artifacts.py fetch --directory "${{ runner.temp }}/utilityos-wheelhouse"
      - name: Install runtime offline into a fresh environment
        run: python scripts/dependency_artifacts.py install --directory "${{ runner.temp }}/utilityos-wheelhouse"
      - name: Rehearse installed code without source-tree assumptions
        run: python scripts/portable_rehearsal.py --wheelhouse "${{ runner.temp }}/utilityos-wheelhouse" --work-dir "${{ runner.temp }}/utilityos-portable-rehearsal"
      - name: Install reviewed test wheels
        run: |
          python -m pip install --only-binary=:all: --disable-pip-version-check -r requirements-bootstrap.txt
          python -m pip install --only-binary=:all: --disable-pip-version-check -c constraints-tested.txt -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run automated synthetic tests
        run: python -m pytest -q -ra
      - name: Check source packaging and native-text benchmark
        run: python scripts/ci_check.py
